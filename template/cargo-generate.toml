[template]
cargo_generate_version = ">=0.10.0"
exclude = ["*.png"]
# workflow files that are only kept for reference
ignore = [
    ".github/workflows/build-with-idasdk.yml",
    ".github/workflows/doc.yml",
    ".github/workflows/doc-with-idasdk.yml",
]

[hooks]
init = ["init-script.rhai"]
#pre = ["pre-script.rhai"]
#post = ["post-script.rhai"]

[placeholders.short-desc]
type = "string"
prompt = "Short description"
default = "TODO"

[placeholders.long-desc]
type = "string"
prompt = "Long description"
default = "TODO"

[conditional.'crate_type == "lib"']
ignore = ["src/main.rs"]
