name: build

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: {% raw %}${{ github.workflow }}{% endraw %}-{% raw %}${{ github.ref }}{% endraw %}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  build-linux-plus-checks:
    name: build-linux-plus-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache health check
        shell: bash
        run: |
          if err=$(sccache --start-server 2>&1 >/dev/null); then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "$err"
            echo "::warning::sccache unavailable, building without cache: ${err%%$'\n'*}"
          fi
      - name: prepare IDA SDK
        env:
          IDASDK_URL: {% raw %}${{ secrets.IDASDK_URL }}{% endraw %}
          IDASDK_PASSWORD: {% raw %}${{ secrets.IDASDK_PASSWORD }}{% endraw %}
        run: |
          curl -o "{% raw %}${{ runner.temp }}{% endraw %}/idasdk.zip" -L "$IDASDK_URL"
          unzip -d "{% raw %}${{ runner.temp }}{% endraw %}" -P "$IDASDK_PASSWORD" "{% raw %}${{ runner.temp }}{% endraw %}/idasdk.zip"
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        env:
          CARGO_BUILD_WARNINGS: deny
          IDASDKDIR: "{% raw %}${{ runner.temp }}{% endraw %}/idasdk"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        env:
          IDASDKDIR: "{% raw %}${{ runner.temp }}{% endraw %}/idasdk"
        run: cargo build --workspace --locked

  build-macos:
    name: build-macos
    runs-on: macOS-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache health check
        shell: bash
        run: |
          if err=$(sccache --start-server 2>&1 >/dev/null); then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "$err"
            echo "::warning::sccache unavailable, building without cache: ${err%%$'\n'*}"
          fi
      - name: prepare IDA SDK
        env:
          IDASDK_URL: {% raw %}${{ secrets.IDASDK_URL }}{% endraw %}
          IDASDK_PASSWORD: {% raw %}${{ secrets.IDASDK_PASSWORD }}{% endraw %}
        run: |
          curl -o "{% raw %}${{ runner.temp }}{% endraw %}/idasdk.zip" -L "$IDASDK_URL"
          unzip -d "{% raw %}${{ runner.temp }}{% endraw %}" -P "$IDASDK_PASSWORD" "{% raw %}${{ runner.temp }}{% endraw %}/idasdk.zip"
      - name: build
        env:
          IDASDKDIR: "{% raw %}${{ runner.temp }}{% endraw %}/idasdk"
        run: cargo build --workspace --locked

  build-windows:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: install clang/llvm
        uses: KyleMayes/install-llvm-action@e0a8dc9cb8a22e8a7696e8a91a4e9581bec13181
        with:
          version: "18.1.8"
          directory: "{% raw %}${{ runner.temp }}{% endraw %}/llvm-18"
      - name: configure clang/llvm environment
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache health check
        shell: bash
        run: |
          if err=$(sccache --start-server 2>&1 >/dev/null); then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "$err"
            echo "::warning::sccache unavailable, building without cache: ${err%%$'\n'*}"
          fi
      - name: prepare IDA SDK
        env:
          IDASDK_URL: {% raw %}${{ secrets.IDASDK_URL }}{% endraw %}
          IDASDK_PASSWORD: {% raw %}${{ secrets.IDASDK_PASSWORD }}{% endraw %}
        run: |
          curl -o "{% raw %}${{ runner.temp }}{% endraw %}/idasdk.zip" -L $env:IDASDK_URL
          unzip -d "{% raw %}${{ runner.temp }}{% endraw %}" -P $env:IDASDK_PASSWORD "{% raw %}${{ runner.temp }}{% endraw %}/idasdk.zip"
      - name: build
        env:
          IDASDKDIR: "{% raw %}${{ runner.temp }}{% endraw %}/idasdk"
        run: cargo build --workspace --locked
