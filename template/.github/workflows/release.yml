name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: {% raw %}${{ github.workflow }}{% endraw %}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-all:
    name: build {% raw %}${{ matrix.target }}{% endraw %}
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: {{project-name}}-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: {{project-name}}-linux-aarch64.tar.gz

          - target: x86_64-apple-darwin
            os: macOS-latest
            name: {{project-name}}-darwin-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macOS-latest
            name: {{project-name}}-darwin-aarch64.tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: {{project-name}}-windows-x86_64.tar.gz

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: {{project-name}}-windows-aarch64.tar.gz

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # submodules: true
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: {% raw %}${{ matrix.target }}{% endraw %}
          cache: false
      - name: build
        if: matrix.os != 'ubuntu-latest'
        env:
          TARGET: {% raw %}${{ matrix.target }}{% endraw %}
        shell: bash
        run: |
          cargo build --release --locked --target "$TARGET"
      - name: dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cross
      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        env:
          TARGET: {% raw %}${{ matrix.target }}{% endraw %}
        shell: bash
        run: |
          cross build --release --locked --target "$TARGET"
      - name: package
        env:
          TARGET: {% raw %}${{ matrix.target }}{% endraw %}
          NAME: {% raw %}${{ matrix.name }}{% endraw %}
        shell: bash
        run: |
          cd "target/$TARGET/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar czf "../../../$NAME" {{project-name}}.exe
          else
            tar czf "../../../$NAME" {{project-name}}
          fi
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: {% raw %}${{ matrix.name }}{% endraw %}
          path: {% raw %}${{ matrix.name }}{% endraw %}

  release:
    name: release
    needs: build-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the github release and upload assets
    steps:
      - name: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: publish # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "*.tar.gz"
          generate_release_notes: true
